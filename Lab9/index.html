<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторна робота 9: To-Do List з LocalStorage</title>
  <style>
    body { font-family: Arial, sans-serif; background: #ecf0f3; margin: 0; padding: 30px 10px; }
    .todo { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h1 { text-align: center; margin-top: 0; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; color: #fff;
             background: #3f51b5; }
    button:hover { opacity: .85; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid #eee; }
    li span { flex: 1; }
    .edit { background: #ff9800; }
    .delete { background: #e53935; }
    .sort { margin-top: 10px; background: #00897b; width: 100%; }
  </style>
</head>
<body>
  <div class="todo">
    <h1>Мій список завдань</h1>
    <p style="text-align:center">Максим Лутчин, АКТ-21, варіант 8</p>
    <div class="row">
      <input type="text" id="taskInput" placeholder="Нове завдання">
      <button id="addBtn">Додати</button>
    </div>
    <button class="sort" id="sortBtn">Сортувати за алфавітом</button>
    <ul id="taskList"></ul>
  </div>

  <script>
    const STORAGE_KEY = "tasks";
    const input = document.getElementById("taskInput");
    const list = document.getElementById("taskList");

    // Читання / збереження в LocalStorage
    function loadTasks() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    }
    function saveTasks(tasks) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    let tasks = loadTasks();

    // Відображення списку
    function render() {
      list.innerHTML = "";
      tasks.forEach((task, index) => {
        const li = document.createElement("li");

        const span = document.createElement("span");
        span.textContent = task;

        // Варіант 8 (парний): редагування
        const editBtn = document.createElement("button");
        editBtn.textContent = "Редагувати";
        editBtn.className = "edit";
        editBtn.addEventListener("click", () => editTask(index));

        const delBtn = document.createElement("button");
        delBtn.textContent = "Видалити";
        delBtn.className = "delete";
        delBtn.addEventListener("click", () => deleteTask(index));

        li.append(span, editBtn, delBtn);
        list.appendChild(li);
      });
    }

    function addTask() {
      const text = input.value.trim();
      if (!text) { alert("Введіть текст завдання!"); return; }
      tasks.push(text);
      saveTasks(tasks);
      input.value = "";
      render();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      saveTasks(tasks);
      render();
    }

    function editTask(index) {
      const newText = prompt("Редагувати завдання:", tasks[index]);
      if (newText !== null && newText.trim() !== "") {
        tasks[index] = newText.trim();
        saveTasks(tasks);
        render();
      }
    }

    // Варіант 8 (парний): сортування за алфавітом
    function sortTasks() {
      tasks.sort((a, b) => a.localeCompare(b, "uk"));
      saveTasks(tasks);
      render();
    }

    document.getElementById("addBtn").addEventListener("click", addTask);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") addTask(); });
    document.getElementById("sortBtn").addEventListener("click", sortTasks);

    render();
  </script>
</body>
</html>
